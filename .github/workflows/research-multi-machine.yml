# TEMPORARY research workflow (removed before merge): can three GitHub-hosted runners reach each
# other over a hole-punched WireGuard mesh, and can a real Acestream engine on one play a dummy
# broadcast from another?
name: Research multi-machine

on:
  push:
    branches: [claude/project-thread-ufla2j]
    paths:
      - .github/workflows/research-multi-machine.yml
      - e2e/multi/**

permissions:
  contents: read
  actions: read

env:
  ENGINE_IMAGE: ghcr.io/martinbjeldbak/acestream-http-proxy:3.5.1@sha256:2679f0473013d1b73ca56c77866ab77f4fd8874012d3f7c36b43c5adf6a8bdca
  GH_TOKEN: ${{ github.token }}

jobs:
  wg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: e2e/multi/mesh.sh prepare wg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-wg
          path: ${{ runner.temp }}/mesh/publish/
          retention-days: 1
      - name: Build the throwaway WireGuard server (in parallel with the mesh)
        run: docker build -q -t wg-server e2e/wg-server
      - run: e2e/multi/mesh.sh join wg source stack
      - name: Start the VPN server and publish its client profile on the mesh
        run: |
          mkdir -p "$RUNNER_TEMP/vpn"
          docker run -d --name vpn --cap-add NET_ADMIN --device /dev/net/tun --sysctl net.ipv4.ip_forward=1 \
            -p 51820:51820/udp -v "$RUNNER_TEMP/vpn:/state" wg-server
          for _ in $(seq 1 30); do [ -s "$RUNNER_TEMP/vpn/client.conf" ] && break; sleep 1; done
          e2e/multi/mesh.sh serve-signals wg
          sudo sed 's/^Endpoint = .*/Endpoint = 192.168.233.1:51820/' "$RUNNER_TEMP/vpn/client.conf" \
            > "$RUNNER_TEMP/mesh/signals/client.conf"
          docker logs vpn
      - run: e2e/multi/mesh.sh wait-signal stack done
      - if: always()
        run: |
          sudo wg show || true
          docker exec vpn wg show || true

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: e2e/multi/mesh.sh prepare source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-source
          path: ${{ runner.temp }}/mesh/publish/
          retention-days: 1
      - name: Start the dummy broadcast (in parallel with the mesh)
        env:
          BROADCAST_ENGINE_IMAGE: ${{ env.ENGINE_IMAGE }}
        run: |
          e2e/multi/broadcast.sh start 192.168.233.2
          head -c 67108864 /dev/urandom > "$RUNNER_TEMP/broadcast/publish/test.bin"
      - run: e2e/multi/mesh.sh join source wg stack
      - run: e2e/multi/broadcast.sh wait
      - run: e2e/multi/mesh.sh wait-signal stack done
      - if: always()
        run: |
          sudo wg show || true
          echo "--- who fetched files (direct = 192.168.233.3, through the VPN = 192.168.233.1)"
          cat "$RUNNER_TEMP/broadcast/http.log" || true
          echo "--- tracker"
          cat "$RUNNER_TEMP/broadcast/tracker.log" || true
          echo "--- broadcaster"
          docker logs aceswarm-broadcast 2>&1 | grep -v 'disk/by-id' | grep -v raven | tail -60 || true

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: e2e/multi/mesh.sh prepare stack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-stack
          path: ${{ runner.temp }}/mesh/publish/
          retention-days: 1
      - name: Pull images (in parallel with the mesh)
        run: |
          docker pull -q "$ENGINE_IMAGE"
          docker build -q -t wg-server e2e/wg-server
      - run: e2e/multi/mesh.sh join stack wg source
      - run: e2e/multi/mesh.sh serve-signals stack
      - name: Mesh latency and throughput
        run: |
          ping -c 5 192.168.233.1
          ping -c 5 192.168.233.2
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://192.168.233.2:18001/test.bin && break; sleep 2; done
          curl -s -o /dev/null -w 'direct: %{size_download} bytes at %{speed_download} B/s\n' http://192.168.233.2:18001/test.bin
      - name: WireGuard tunnel inside the mesh (C -> A -> B)
        run: |
          for _ in $(seq 1 60); do curl -sf -o "$RUNNER_TEMP/vpn.conf" http://192.168.233.1:18999/client.conf && break; sleep 2; done
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun -v "$RUNNER_TEMP/vpn.conf:/vpn.conf:ro" wg-server sh -ec '
            gw=$(ip route show default | awk "{print \$3}")
            ip link add wg0 type wireguard 2>/dev/null || wireguard-go wg0
            grep -vE "^(Address|DNS)" /vpn.conf > /tmp/wg.conf
            wg setconf wg0 /tmp/wg.conf
            ip address add 10.13.13.2/32 dev wg0
            ip link set wg0 mtu 1300 up
            ip route add 192.168.233.1/32 via "$gw"
            ip route replace default dev wg0
            ping -c 3 10.13.13.1
            wget -O /dev/null http://192.168.233.2:18001/test.bin
            wg show'
      - name: Real engine plays the broadcast from the other runner
        run: |
          set -x
          docker run -d --name player -p 127.0.0.1:16878:6878 --entrypoint /app/start-engine "$ENGINE_IMAGE" \
            --client-console --bind-all --log-stdout --disable-sentry
          api=http://127.0.0.1:16878
          for _ in $(seq 1 60); do curl -sf "$api/webui/api/service?method=get_version&format=json" && break; sleep 1; done
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://192.168.233.2:18001/test.acelive && break; sleep 2; done
          play() {
            local query="$1" out="$2" resp url stat
            resp=$(curl -s -m 150 "$api/ace/getstream?$query&format=json")
            echo "$resp"
            url=$(jq -r '.response.playback_url // empty' <<<"$resp")
            stat=$(jq -r '.response.stat_url // empty' <<<"$resp")
            [ -n "$url" ] || return 1
            curl -sL -m 45 -o "$out" "$url" || true
            ls -la "$out" || true
            curl -s "$stat" | jq -c '.response | {status, peers, speed_down, downloaded}' || true
            ffprobe -v error -show_entries stream=codec_name,width,height -of compact "$out" || true
          }
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          acelive=$(printf %s http://192.168.233.2:18001/test.acelive | jq -sRr @uri)
          play "url=$acelive&pid=a" "$RUNNER_TEMP/a.ts" || echo "url= FAILED"
          infohash=$(curl -s "$api/ace/getstream?url=$acelive&format=json&pid=x" | jq -r .response.infohash)
          echo "infohash=$infohash"
          play "infohash=$infohash&pid=b" "$RUNNER_TEMP/b.ts" || echo "infohash= (same engine) FAILED"
          docker run -d --name player2 -p 127.0.0.1:16879:6878 --entrypoint /app/start-engine "$ENGINE_IMAGE" \
            --client-console --bind-all --log-stdout --disable-sentry
          api=http://127.0.0.1:16879
          for _ in $(seq 1 60); do curl -sf "$api/webui/api/service?method=get_version&format=json" && break; sleep 1; done
          play "infohash=$infohash&pid=c" "$RUNNER_TEMP/c.ts" || echo "infohash= (fresh engine) FAILED"
      - if: always()
        run: |
          e2e/multi/mesh.sh signal done
          sudo wg show || true
          docker logs player 2>&1 | grep -v 'disk/by-id' | grep -viE 'ipfs|ui_sync' | tail -60 || true
          echo "--- player2"
          docker logs player2 2>&1 | grep -v 'disk/by-id' | grep -viE 'ipfs|ui_sync' | tail -40 || true
          sleep 20
