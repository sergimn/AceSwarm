name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/aceswarm

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # Nothing installs npm from packageManager: CI and the images run the npm that comes with
      # Node.js. Keep the field equal to it, so Renovate writes lock files with that npm too.
      - name: Check that packageManager names the npm that comes with Node.js
        run: |
          declared=$(node -p 'require("./package.json").packageManager')
          shipped="npm@$(npm --version)"
          if [ "$declared" != "$shipped" ]; then
            problem="packageManager is $declared, but Node.js $(node --version) comes with $shipped."
            echo "::error file=package.json::$problem Set \"packageManager\": \"$shipped\" in package.json."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build:ui

  ffmpeg-gaps:
    name: ffmpeg with timestamp gaps
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The transcoder's own ffmpeg: the image the Dockerfile copies it from.
      - name: Take ffmpeg out of the image the transcoder uses
        run: |
          image=$(sed -n 's/^FROM \(docker\.io\/mwader\/static-ffmpeg:[^ ]*\) AS ffmpeg$/\1/p' Dockerfile)
          test -n "$image"
          container=$(docker create "$image")
          docker cp "$container:/ffmpeg" "$RUNNER_TEMP/ffmpeg"
          docker rm "$container"
          "$RUNNER_TEMP/ffmpeg" -version | head -n 1
      # Also runs the full output that stops on a broadcast without key frames, the check that the
      # transcoder finds the key frames ffmpeg can cut a copy at, and the slate for players outside
      # the page, on the same binary.
      # One file at a time: the first two time real ffmpeg runs, which must not compete for the CPU.
      - run: >-
          npx vitest run --no-file-parallelism
          apps/transcoder/test/ffmpeg-gaps.test.ts apps/transcoder/test/ffmpeg-full-stall.test.ts
          apps/transcoder/test/ffmpeg-cut-points.test.ts apps/transcoder/test/ffmpeg-slate.test.ts
        env:
          FFMPEG_BIN: ${{ runner.temp }}/ffmpeg

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installing the hook environments takes about a minute (gitleaks builds from source).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The Node.js hooks need node_modules and run in the "check" job instead. On pushes to main,
      # the checkout is the main branch itself, which no-commit-to-branch would reject.
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: prettier,eslint,typecheck,unit-tests,no-commit-to-branch

  images:
    name: Image ${{ matrix.image }} (amd64 + arm64)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            file: Dockerfile
            target: controller
          - image: transcoder
            file: Dockerfile
            target: transcoder
          - image: netgw
            file: Dockerfile
            target: netgw
          - image: engine
            file: engine/Dockerfile
            target: ""
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
