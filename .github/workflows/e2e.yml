# End-to-end tests across five GitHub-hosted runners, with real Acestream engines (no mocks):
#
#   wg            a throwaway WireGuard server; generates one client profile per stack runner
#   source        eight dummy live broadcasts from real Acestream engines, plus the tracker players
#                 use: bc1-bc3 for one stack runner, bc4-bc6 for the other, bc7-bc8 for the arm64 one
#   stack         AceSwarm on Docker with real engines, and the Playwright tests
#   stack-podman  the same on rootless Podman, set up like a host that runs `docker compose up` on
#                 Podman (e2e/podman.sh)
#   stack-arm64   the same on Docker on an arm64 runner, with the arm64 engine (the Raspberry Pi's),
#                 running only the arm64 disk cache test (e2e/tests/arm64-disk-cache.spec.ts)
#
# All but stack-arm64 run on ubuntu-26.04. Its AppArmor profiles for wg and pasta matter to the mesh and the
# Podman leg (see "The Podman stack runner" in e2e/README.md).
#
# The runners can't accept connections from the internet, so they first join a WireGuard mesh by
# hole punching, using STUN and this run's artifacts to find each other (e2e/mesh.sh). The
# WireGuard server and the broadcasts then start in parallel. e2e/README.md has diagrams.
#
# Re-run all jobs, never only the failed one: the runners only work together. e2e-retry.yml does that
# by itself for a run that stopped at "Find this runner's public UDP address".
#
# Every setup and test step has a time limit of a few times its usual length, so a step that hangs
# fails within minutes rather than at the job's limit, and mesh.sh stops waiting for a runner whose job ended.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job sets its own permissions.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per attempt, so a re-run never picks up the addresses of runners that are gone.
  MESH_ARTIFACT_PREFIX: mesh-${{ github.run_attempt }}-

jobs:
  wg:
    # mesh.sh (job_name) looks for this job by name.
    name: WireGuard server
    permissions:
      contents: read
      # The runners publish their mesh addresses as artifacts and read the others' through the
      # API; write also lets a runner that can't join the mesh cancel the run.
      actions: write
    runs-on: ubuntu-26.04
    # Serves until all stack jobs are done, which may start late, so it outlasts their limit.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      # e2e-retry.yml looks for this step by name: it re-runs a run that fails here.
      - name: Find this runner's public UDP address
        # Usually 10-15 s. mesh.sh retries its slow parts, each with a time limit of its own.
        timeout-minutes: 6
        run: e2e/mesh.sh prepare wg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: ${{ env.MESH_ARTIFACT_PREFIX }}wg
          path: ${{ runner.temp }}/mesh/publish/
          if-no-files-found: error
          retention-days: 1
      - name: Join the mesh
        # A stack runner that is late or never starts must not take the other one's VPN down with
        # it. One that fails before joining cancels the run from its own job.
        # Usually seconds; up to 10 minutes per peer for a runner that starts late.
        timeout-minutes: 20
        run: e2e/mesh.sh join wg source "stack?" "stack-podman?" "stack-arm64?"
        env:
          # Only this step reads the other runners' artifacts.
          GH_TOKEN: ${{ github.token }}
      - name: Cancel the run if this runner couldn't join the mesh
        # wg and source need each other, and all stacks need both of them, so without this
        # runner the others would wait minutes and then fail too. Only a failure up to here
        # cancels.
        if: failure()
        timeout-minutes: 2
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start the WireGuard server
        timeout-minutes: 10
        run: |
          e2e/vpn.sh build
          e2e/vpn.sh start "$(e2e/mesh.sh ip wg)" client-stack client-stack-podman client-stack-arm64
          for client in client-stack client-stack-podman client-stack-arm64; do
            e2e/mesh.sh share "$(e2e/vpn.sh profile "$client")"
          done
      - name: Serve until the tests are done
        run: e2e/mesh.sh wait-all "done" stack stack-podman stack-arm64
      - name: Logs
        if: always()
        timeout-minutes: 5
        run: |
          sudo wg show wg-mesh || true
          e2e/vpn.sh logs

  source:
    # mesh.sh (job_name) looks for this job by name.
    name: Dummy Acestream broadcast
    permissions:
      contents: read
      # The runners publish their mesh addresses as artifacts and read the others' through the
      # API; write also lets a runner that can't join the mesh cancel the run.
      actions: write
    runs-on: ubuntu-26.04
    # Serves until all stack jobs are done, which may start late, so it outlasts their limit.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      # e2e-retry.yml looks for this step by name: it re-runs a run that fails here.
      - name: Find this runner's public UDP address
        # Usually 10-15 s. mesh.sh retries its slow parts, each with a time limit of its own.
        timeout-minutes: 6
        run: e2e/mesh.sh prepare source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: ${{ env.MESH_ARTIFACT_PREFIX }}source
          path: ${{ runner.temp }}/mesh/publish/
          if-no-files-found: error
          retention-days: 1
      - name: Join the mesh
        # Usually seconds; up to 10 minutes per peer for a runner that starts late.
        timeout-minutes: 20
        run: e2e/mesh.sh join source wg "stack?" "stack-podman?" "stack-arm64?"
        env:
          # Only this step reads the other runners' artifacts.
          GH_TOKEN: ${{ github.token }}
      - name: Cancel the run if this runner couldn't join the mesh
        # wg and source need each other, and all stacks need both of them, so without this
        # runner the others would wait minutes and then fail too. Only a failure up to here
        # cancels.
        if: failure()
        timeout-minutes: 2
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start the broadcasts
        timeout-minutes: 10
        run: |
          e2e/broadcast.sh start "$(e2e/mesh.sh ip source)" 8
          e2e/broadcast.sh wait > "$RUNNER_TEMP/broadcasts.json"
          e2e/mesh.sh share "$RUNNER_TEMP/broadcasts.json"
      - name: Serve until the tests are done
        run: e2e/mesh.sh wait-all "done" stack stack-podman stack-arm64
      - name: Logs
        if: always()
        timeout-minutes: 5
        run: |
          sudo wg show wg-mesh || true
          e2e/broadcast.sh logs

  stack:
    # mesh.sh (job_name) looks for these jobs by name.
    name: AceSwarm with real engines${{ matrix.label }}
    permissions:
      contents: read
      # The runners publish their mesh addresses as artifacts and read the others' through the
      # API; write also lets a runner that can't join the mesh cancel the run.
      actions: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Each stack runner tests on its own: once all stacks have joined the mesh, one failing must not
      # cancel the other. A failure up to the join cancels the whole run on purpose.
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            role: stack
            arch: amd64
            label: ""
            os: ubuntu-26.04
            broadcasts: bc1,bc2,bc3
          # Rootless Podman 5 from the distribution, as on a current Ubuntu host.
          - runtime: podman
            role: stack-podman
            arch: amd64
            label: " (Podman)"
            os: ubuntu-26.04
            broadcasts: bc4,bc5,bc6
          # The Raspberry Pi's engine: the arm64 Android build, on an arm64 runner. Its job runs only the
          # arm64 disk cache test, which checks that the arm64 engine keeps its stream cache on disk.
          - runtime: docker
            role: stack-arm64
            arch: arm64
            label: " (arm64)"
            os: ubuntu-24.04-arm
            broadcasts: bc7,bc8
    env:
      MESH_ROLE: ${{ matrix.role }}
      # Its own broadcasts: the tests tell the paths apart by who announced to the tracker, and all
      # stack runners' VPN traffic leaves from the WireGuard server's runner.
      E2E_BROADCASTS: ${{ matrix.broadcasts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
          cache: npm
      # e2e-retry.yml looks for this step by name: it re-runs a run that fails here.
      - name: Find this runner's public UDP address
        # Usually 10-15 s. mesh.sh retries its slow parts, each with a time limit of its own.
        timeout-minutes: 6
        run: |
          e2e/mesh.sh prepare "$MESH_ROLE"
          echo "MESH_SELF_IP=$(e2e/mesh.sh ip "$MESH_ROLE")" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: ${{ env.MESH_ARTIFACT_PREFIX }}${{ matrix.role }}
          path: ${{ runner.temp }}/mesh/publish/
          if-no-files-found: error
          retention-days: 1
      - name: Join the mesh
        # Usually seconds; up to 10 minutes per peer for a runner that starts late.
        timeout-minutes: 20
        run: e2e/mesh.sh join "$MESH_ROLE" wg source
        env:
          # Only this step reads the other runners' artifacts.
          GH_TOKEN: ${{ github.token }}
      - name: Cancel the run if this runner couldn't join the mesh
        # The other stack could still run without this one (wg and source take the stacks as
        # optional peers), but a run with a stack missing can't validate a change, so cancel it
        # for a fast red result instead. Only a failure up to here cancels: after the mesh is up,
        # a stack job's failure must not cancel the other's tests.
        if: failure()
        timeout-minutes: 2
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Set up rootless Podman
        if: matrix.runtime == 'podman'
        timeout-minutes: 10
        run: e2e/podman.sh setup
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - run: npx playwright install --with-deps chromium ffmpeg
        timeout-minutes: 10
      - name: Build the images and start AceSwarm
        timeout-minutes: 15
        run: |
          e2e/stack.sh build
          e2e/stack.sh up
      - name: Wait for the WireGuard server and the broadcasts
        # Usually ready by now, but the shared runners start their servers only once all stacks
        # joined or 10 minutes passed.
        timeout-minutes: 15
        run: |
          e2e/mesh.sh wait-file wg "client-$MESH_ROLE.conf" >/dev/null
          e2e/mesh.sh wait-file source broadcasts.json
          e2e/stack.sh check
      - name: Run the tests
        # About half an hour. Playwright stops at 45 minutes (globalTimeout) and still writes its report.
        if: matrix.arch != 'arm64'
        timeout-minutes: 50
        run: npm run e2e
      - name: Run the arm64 disk cache test
        # The goal of this leg: the arm64 engine keeps its stream cache on disk, which
        # e2e/tests/arm64-disk-cache.spec.ts checks. The other stack jobs run the whole suite instead.
        if: matrix.arch == 'arm64'
        timeout-minutes: 20
        run: npm run e2e -- e2e/tests/arm64-disk-cache.spec.ts
      - name: Tell the other runners the tests are done
        # Also after failed tests, but not in a cancelled run: the other jobs are being cancelled
        # too, so nobody would fetch the file and this step would wait out wait-fetched's limit.
        # A job that hits its own time limit counts as cancelled as well: wg and source then
        # wait about five minutes for this runner to stop answering, and fail.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          date -u > "$RUNNER_TEMP/done"
          e2e/mesh.sh share "$RUNNER_TEMP/done"
          # This runner's file server stops with the job: keep it up until both have the file.
          e2e/mesh.sh wait-fetched "done" wg source
      - name: Logs
        if: always()
        timeout-minutes: 5
        run: |
          sudo wg show wg-mesh || true
          e2e/stack.sh logs > e2e-stack.log 2>&1 || true
          tail -n 200 e2e-stack.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: e2e-results-${{ matrix.role }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            e2e-stack.log
          retention-days: 14
      - name: Stop AceSwarm
        if: always()
        # On Ubuntu 26.04, Podman can't stop pasta when the last container leaves its network
        # ("rootless netns: kill network process: permission denied"): pasta's AppArmor profile
        # doesn't let it receive signals. The runner is thrown away anyway.
        continue-on-error: ${{ matrix.runtime == 'podman' }}
        timeout-minutes: 5
        run: e2e/stack.sh down
      - name: Check that the stack left no engines
        # Its cleanup service removes them on the way down, on Podman too.
        if: always()
        timeout-minutes: 2
        run: e2e/stack.sh leftovers
