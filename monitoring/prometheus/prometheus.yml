# Prometheus scrapes the AceSwarm services directly (no agent in between).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aceswarm
    static_configs:
      - targets: ["controller:8080", "transcoder:8081", "netgw:8082"]
