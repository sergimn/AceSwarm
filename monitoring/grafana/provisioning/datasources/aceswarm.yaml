apiVersion: 1

datasources:
  - name: Prometheus
    uid: aceswarm-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Loki
    uid: aceswarm-loki
    type: loki
    access: proxy
    url: http://loki:3100
