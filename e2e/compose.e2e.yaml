# End-to-end test stack: the real services with real Acestream engines, on the runner that runs
# the tests. The broadcasts and the WireGuard server run on two other runners, reached through the
# mesh (e2e/mesh.sh): see e2e/README.md. e2e/stack.sh builds the images and starts it.

services:
  controller:
    image: aceswarm-controller:e2e
    environment:
      ENGINE_IMAGE: aceswarm-engine:e2e
      ENGINE_READY_TIMEOUT_SECONDS: "90"
      # Real engines need a few seconds to open a session and buffer.
      STARTUP_GRACE_SECONDS: "45"
      STALL_SECONDS: "12"
      TICK_MS: "1000"
      RECOVERY_BASE_DELAY_SECONDS: "1"
      RECOVERY_MAX_DELAY_SECONDS: "4"
      # While a broadcast sends nothing new: a new session every 10 s (see the transcoder below).
      STALE_SOURCE_RETRY_SECONDS: "10"
      # Stickiness then comes only from a healthy stream never moving, which the tests check.
      PATH_MIN_DWELL_SECONDS: "0"
    ports: !override
      - 127.0.0.1:${E2E_HTTP_PORT:-18080}:8080

  cleanup:
    image: aceswarm-controller:e2e

  transcoder:
    image: aceswarm-transcoder:e2e
    environment:
      PREVIEW_FPS: "10"
      PREVIEW_HEIGHT: "180"
      # A broadcast whose live edge doesn't move for this long is stale (60 s by default).
      STALE_SOURCE_SECONDS: "30"

  netgw:
    image: aceswarm-netgw:e2e
    environment:
      GEOIP_DOWNLOAD: "false"
      # Mesh addresses: the broadcast runner and the WireGuard server's runner.
      GEOIP_STATIC: 192.0.2.2=ES,192.0.2.1=SE
      # GitHub's runners can't ping the internet (Azure drops ICMP), so every path would stay down
      # and engines would get no path at all. Probe the WireGuard server's runner instead: it is
      # reachable directly over the mesh and through the tunnel alike.
      PROBE_TARGETS: 192.0.2.1
      PROBE_INTERVAL_SECONDS: "3"
      PEERS_INTERVAL_SECONDS: "2"
