extends: default

ignore: |
  node_modules/
  package-lock.json

rules:
  line-length:
    max: 120
    # Image references with digests and alert texts.
    allow-non-breakable-inline-mappings: true
  document-start: disable
  # GitHub Actions uses "on:" as a key.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
